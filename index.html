<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SSC MATE - Free Ebook Library</title>

<!-- ============ MONETAG SCRIPT YAHAN PASTE KARO (head) ============
     Monetag dashboard se mila hua <script ...></script> (In-Page Push / Vignette / Popunder etc.)
     bas niche is line ke neeche paste kar do. -->

<style>
:root{--b:#0b3fbf;--b2:#0a58ff;--y:#ffc400;--bg:#f4f7fd;--t:#10193a;--m:#5b6685;--bd:#e1e7f5}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
.w{max-width:760px;margin:0 auto;padding:0 14px}
header{background:var(--b);color:#fff;border-radius:0 0 26px 26px;padding:14px 16px 28px}
header .w{display:flex;align-items:center;gap:12px;padding:0}
.logo{font-size:34px}
header h1{font-size:26px;font-weight:800;line-height:1}
header h1 b{color:var(--y)}
header i{font-size:14px;opacity:.9}
.sbox{position:sticky;top:8px;z-index:6;display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;margin:-16px 0 14px;box-shadow:0 6px 18px #0b3fbf26;overflow:hidden}
.sbox input{flex:1;border:0;padding:14px;font-size:15px;outline:0;min-width:0}
.sbox button{background:var(--b2);color:#fff;border:0;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
.bn{position:relative;margin-bottom:14px}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px}
.trk::-webkit-scrollbar{display:none}
.sl{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/7;min-height:150px;cursor:pointer;background:#dbe4fb}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl .ov{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(0deg,#000a,#0000 65%)}
.sl h3{font-size:22px;line-height:1.15}
.sl p{font-size:14px;opacity:.95;margin-top:4px}
.sl .ab{align-self:flex-start;margin-top:8px;background:var(--y);color:#10193a;border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:4px;background:#c2cbe3;transition:.25s}
.dots i.on{width:22px;background:var(--b2)}
.hero{background:linear-gradient(120deg,#fff3cf,#fff7e0 60%,#d5f3dd);border-radius:20px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.hero h2{font-size:30px;line-height:1.08;font-weight:800;color:var(--b)}
.hero h2 span{color:#f23a1e}
.hero p{margin:10px 0 14px;font-weight:600}
.hero .stack{font-size:70px}
.btn{background:var(--b2);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.tabs button{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;font-size:14px;color:var(--m);cursor:pointer}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.cats{background:#eef3fd;border:1px solid var(--bd);border-radius:18px;padding:14px 6px;display:flex;overflow-x:auto;gap:4px;margin-bottom:8px;scrollbar-width:none}
.cats div{min-width:84px;flex:1;text-align:center;font-size:13px;cursor:pointer}
.cats div span{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;margin:0 auto 6px;font-size:26px}
.cats div.on{font-weight:800;color:var(--b)}
h2.sec{font-size:24px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:0 2px 8px #0b3fbf0d}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#dbe4fb;cursor:pointer}
.ci{flex:1;min-width:0}
.ci h3{font-size:15px;line-height:1.2;margin-bottom:6px;cursor:pointer}
.ci p{font-size:13px;color:var(--m);margin:6px 0 8px}
.chips span{display:inline-block;background:#dde8ff;color:var(--b);border-radius:8px;padding:3px 9px;font-size:12px;margin:0 4px 4px 0}
.ci .btn{width:100%;padding:9px}
.safe{display:flex;gap:12px;align-items:center;background:#e4f7ea;border:1px solid #bfe7cb;border-radius:16px;padding:14px;margin:18px 0}
.safe b{font-size:20px;display:block}.safe small{color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 10px;z-index:5}
nav a{text-decoration:none;color:var(--m);font-size:12px;text-align:center;padding:2px 10px;border-bottom:3px solid transparent}
nav a span{display:block;font-size:22px}
nav a.on{color:var(--b2);font-weight:700;border-color:var(--b2)}
.empty{padding:30px 10px;text-align:center;color:var(--m)}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:9}
.modal>div{position:relative;background:#fff;border-radius:22px 22px 0 0;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal .top{display:flex;gap:14px}
.modal img{width:110px;height:150px;object-fit:cover;border-radius:8px}
.sbox button.x{background:none;color:var(--m);padding:0 12px;font-size:18px}
#list{scroll-margin-top:72px}
body.searching .bn,body.searching .hero,body.searching .cats,body.searching .tabs,body.searching .safe,body.searching #adslot{display:none}
.mx{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:#eef2fb;font-size:16px;cursor:pointer}
.modal h2{padding-right:30px}
.dym{padding:0 4px 12px}.dym p{font-weight:600;margin-bottom:8px}
.dym button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;margin:0 6px 6px 0;cursor:pointer;font:inherit;font-size:14px;color:var(--b)}
.ad{text-align:center;margin:10px auto}
.sk{height:132px;border-radius:16px;background:linear-gradient(90deg,#e8edf9,#f6f8fd,#e8edf9);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head>
<body>
<div id="app"></div>

<!-- ============ MONETAG AD SLOT (banner / native ad code yahan paste karo) ============ -->
<div class="w ad" id="adslot">
  <!-- yahan Monetag ka banner/native ad code paste karo -->
</div>

<div id="modal"></div>
<nav id="nav"></nav>

<script type="module">
import {db} from "./firebase-config.js";
import {collection,getDocs,updateDoc,doc,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Monetag Direct Link (optional): Download dabane par naye tab me khulega. Khali chhodo to band rahega. */
const MONETAG_DIRECT_LINK = "";
const ABOUT = "SSC MATE par aap SSC aur dusre competitive exams ki free ebooks aur PDFs download kar sakte ho. Koi registration ya charge nahi.";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const go=u=>{if(u)window.open(u,"_blank","noopener")};

const TYPES={category:"Category",subcategory:"Sub Category",subject:"Subject",exam:"Exam",teacher:"Teacher",coaching:"Coaching"};
const DEF={
 category:["Competitive Exam","Academic Books","Novels & Fiction","Self Help","Biography"],
 subcategory:[],
 subject:["Maths","English","Reasoning","General Knowledge","General Science","History","Geography","Polity","Economics","Computer","Current Affairs"],
 exam:["SSC CGL","SSC CHSL","SSC MTS","SSC GD","SSC CPO","SSC JE","Railway","Banking"],
 teacher:[],coaching:[]};
const ICON=["🎓","📗","📖","🙋","👤","➕"],BG=["#dbeafe","#d5f0dd","#fde1ec","#ffe6c7","#e4e0ff","#e5e9f5"];

let books=[],tax=[],BN=[],loaded=false,F={type:"category",val:""},q="",tm;
const vals=t=>[...new Set([...DEF[t],...tax.filter(x=>x.type==t).map(x=>x.name)])];

const CK="ssc_cache";
function refreshView(){document.activeElement?.id=="q"?renderList():route()}
async function load(){
 const c=LS(CK,null);
 if(c&&c.d&&Date.now()-c.t<6e5){({books,tax,BN}=c.d);loaded=true;refreshView()}
 try{
  const g=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
  [books,tax,BN]=await Promise.all([g("books"),g("tax"),g("banners")]);
  BN=BN.filter(b=>b.active!==false&&b.img).sort((a,b)=>(a.order||0)-(b.order||0));
  SV(CK,{t:Date.now(),d:{books,tax,BN}});
 }catch(e){console.warn("Firebase:",e.message);if(c&&c.d&&!books.length)({books,tax,BN}=c.d)}
 loaded=true;
}

/* ===== SEARCH: sabse zyada match upar ===== */
const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9\u0900-\u097f ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}
function subseq(a,b){let i=0;for(const c of b){if(c==a[i])i++}return i==a.length}
function fuzzyWord(t,w){
 if(t==w)return 20;
 if(t.length>=3&&w.startsWith(t))return 16;
 if(t.length>=4&&w.includes(t))return 12;
 const bud=t.length>=9?3:t.length>=6?2:t.length>=4?1:0;
 if(bud&&Math.abs(t.length-w.length)<=bud&&lev(t,w)<=bud)return 10;
 if(t.length>=5&&w.length>t.length&&t[0]==w[0]&&subseq(t,w))return 8;
 return 0;
}
function score(b,query){
 const Q=norm(query),T=Q.split(" ").filter(Boolean);if(!T.length)return 0;
 const title=norm(b.title),tw=title.split(" ");
 const rw=[...new Set(norm([b.author,b.category,b.subcategory,b.subject,b.exam,b.teacher,b.coaching,b.tags,b.desc].join(" ")).split(" "))];
 let s=0,hit=0,th=0;
 if(title==Q)s+=100;else if(title.startsWith(Q))s+=60;else if(title.includes(Q))s+=40;
 for(const t of T){
  let h=Math.max(0,...tw.map(w=>fuzzyWord(t,w)));
  if(h)th++;else h=Math.max(0,...rw.map(w=>fuzzyWord(t,w)))*.4;
  s+=h;if(h)hit++}
 if(!hit||(!th&&hit<T.length))return 0; /* junk block */
 if(hit==T.length)s+=15;
 return s+(b.popular?1:0);
}
function suggest(){
 const T=norm(q).split(" ").filter(Boolean);
 return books.map(b=>{let d=9;for(const t of T)for(const x of norm(b.title).split(" "))d=Math.min(d,lev(t,x)/Math.max(t.length,x.length));return{b,d}}).filter(x=>x.d<=.5).sort((a,b)=>a.d-b.d).slice(0,4).map(x=>x.b);
}
function setS(){document.body.classList.toggle("searching",!!q.trim()||document.activeElement?.id=="q")}
function doSearch(){q=$("#q").value;$("#q").blur();renderList();setS();$("#list").scrollIntoView({behavior:"smooth",block:"start"})}
window.bnErr=img=>{const sl=img.closest(".sl");if(!sl)return;const t=sl.parentElement;sl.remove();document.querySelector("#dots i:last-child")?.remove();if(!t.children.length)t.closest(".bn").style.display="none"};
function filtered(){
 let l=books.filter(b=>!F.val||b[F.type]==F.val);
 if(q.trim())l=l.map(b=>({b,s:score(b,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.b);
 return l;
}

/* ===== UI ===== */
const card=b=>`<div class="card"><img data-id="${b.id}" src="${esc(b.thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="ci"><h3 data-id="${b.id}">${esc(b.title)}</h3><div class="chips">${[b.exam,b.subject,b.category].filter(Boolean).slice(0,2).map(x=>`<span>${esc(x)}</span>`).join("")}</div><p>📄 PDF • ${esc(b.size||"—")}</p><button class="btn" data-id="${b.id}">⬇ Download Now</button></div></div>`;
const list=(l,m)=>!loaded?`<div class="grid"><div class="sk"></div><div class="sk"></div></div>`:l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty">${m||"Koi book nahi mili."}</div>`;
const head=()=>`<header><div class="w"><div class="logo">📖</div><div><h1>SSC <b>MATE</b></h1><i>Read • Learn • Grow</i></div></div></header>`;

function banner(){
 if(!BN.length)return `<div class="hero"><div><h2>Download <span>Free</span><br>Ebooks &amp; PDFs</h2><p>Study • Prepare • Enjoy</p><button class="btn" id="br">Browse Books →</button></div><div class="stack">📚</div></div>`;
 return `<div class="bn"><div class="trk" id="trk">${BN.map((b,i)=>`<div class="sl" data-bl="${i}"><img src="${esc(b.img)}" alt="${esc(b.title)}" ${i?'loading="lazy"':""} onerror="bnErr(this)"><div class="ov">${b.title?`<h3>${esc(b.title)}</h3>`:""}${b.sub?`<p>${esc(b.sub)}</p>`:""}${b.attach?`<button class="ab" data-ba="${i}">📎 ${esc(b.btn||"Attachment")}</button>`:""}</div></div>`).join("")}</div>${BN.length>1?`<div class="dots" id="dots">${BN.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}</div>`;
}
function auto(){
 clearInterval(tm);const t=$("#trk");if(!t||BN.length<2)return;
 const run=()=>{clearInterval(tm);tm=setInterval(()=>{const w=t.clientWidth,i=Math.round(t.scrollLeft/w);const n=t.children.length;t.scrollTo({left:((i+1)%n)*w,behavior:"smooth"})},4000)};
 t.addEventListener("scroll",()=>{const i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k==i))});
 ["touchstart","mouseenter"].forEach(e=>t.addEventListener(e,()=>clearInterval(tm),{passive:true}));
 ["touchend","mouseleave"].forEach(e=>t.addEventListener(e,run,{passive:true}));
 run();
}
function renderList(){
 const el=$("#list");if(!el)return;
 if(q.trim()||F.val){const l=filtered(),sg=!l.length&&loaded&&q.trim()?suggest():[];el.innerHTML=`<h2 class="sec">🔍 Results (${l.length})</h2>`+list(l,"Is search/filter se koi book nahi mili.")+(sg.length?`<div class="dym"><p>Kya aap ye khoj rahe the?</p>${sg.map(b=>`<button data-sg="${b.id}">${esc(b.title)}</button>`).join("")}</div>`:"");return}
 const pop=books.filter(b=>b.popular),p=pop.length?pop:[...books].sort((a,b)=>(b.downloads||0)-(a.downloads||0)).slice(0,6);
 el.innerHTML=`<h2 class="sec">🏆 Popular Books</h2>`+list(p,"Abhi koi book add nahi hui.")+(loaded&&books.length?`<h2 class="sec">🆕 Latest Books</h2>`+list([...books].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,20)):"");
}
function renderFilters(){
 $("#ft").innerHTML=Object.entries(TYPES).map(([k,v])=>`<button data-t="${k}" class="${F.type==k?"on":""}">${v}</button>`).join("");
 $("#fv").innerHTML=`<button data-v="" class="${!F.val?"on":""}">All</button>`+vals(F.type).map(v=>`<button data-v="${esc(v)}" class="${F.val==v?"on":""}">${esc(v)}</button>`).join("");
}
function home(){
 $("#app").innerHTML=head()+`<div class="w"><div class="sbox"><input id="q" placeholder="Search for books... (e.g. SSC, English, Novel)" value="${esc(q)}"><button class="x" id="cx" ${q?"":"hidden"}>✕</button><button id="sb">🔍 Search</button></div>
 ${banner()}
 <div class="cats">${vals("category").map((c,i)=>`<div data-c="${esc(c)}" class="${F.type=="category"&&F.val==c?"on":""}"><span style="background:${BG[i%6]}">${ICON[i%6]}</span>${esc(c)}</div>`).join("")}</div>
 <div class="tabs" id="ft"></div><div class="tabs" id="fv"></div>
 <div id="list"></div>
 <div class="safe"><div style="font-size:38px">✅</div><div><b>100% Free &amp; Safe</b><small>No Registration | No Charges | Direct Download</small></div></div></div>`;
 renderFilters();renderList();auto();setS();
}
function cats(){
 $("#app").innerHTML=head()+`<div class="w"><h2 class="sec">Categories</h2>`+Object.entries(TYPES).map(([k,v])=>`<div class="panel"><b>${v}</b><div class="tabs" style="flex-wrap:wrap">${vals(k).map(x=>`<button data-go="${k}|${esc(x)}">${esc(x)} (${books.filter(b=>b[k]==x).length})</button>`).join("")}</div></div>`).join("")+`</div>`;
}
function saved(key,title,msg){
 const ids=LS(key,[]);$("#app").innerHTML=head()+`<div class="w"><h2 class="sec">${title}</h2>`+list(ids.map(i=>books.find(b=>b.id==i)).filter(Boolean),msg)+`</div>`;
}
function about(){$("#app").innerHTML=head()+`<div class="w"><div class="panel"><h2>SSC MATE</h2><p style="margin-top:8px;line-height:1.5">${esc(ABOUT)}</p></div></div>`}
function detail(id){
 const b=books.find(x=>x.id==id);if(!b)return;const fav=LS("fav",[]).includes(id);
 $("#modal").innerHTML=`<div class="modal" id="mo"><div><button class="mx" id="mx" aria-label="Close">✕</button><div class="top"><img src="${esc(b.thumb)}" alt=""><div><h2 style="font-size:20px">${esc(b.title)}</h2><p style="color:var(--m);margin:6px 0">${esc(b.author||"")}</p><div class="chips">${[b.category,b.subcategory,b.subject,b.exam,b.teacher,b.coaching].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div><p style="font-size:13px;color:var(--m)">📄 PDF • ${esc(b.size||"—")} • ⬇ ${b.downloads||0}</p></div></div>
 <p style="margin:14px 0;line-height:1.5;white-space:pre-line">${esc(b.desc||"")}</p>
 <button class="btn" style="width:100%" data-dl="${id}">⬇ Download PDF</button>
 <button class="btn" style="width:100%;margin-top:8px;background:#e8eefc;color:var(--b)" data-fav="${id}">${fav?"★ Favorites se hatao":"☆ Favorites me jodo"}</button></div></div>`;
}
async function download(id){
 const b=books.find(x=>x.id==id);if(!b||!b.pdf)return;
 if(MONETAG_DIRECT_LINK)go(MONETAG_DIRECT_LINK);
 const a=document.createElement("a");a.href=b.pdf;a.target="_blank";a.rel="noopener";a.download="";document.body.appendChild(a);a.click();a.remove();
 const d=LS("dl",[]).filter(x=>x!=id);d.unshift(id);SV("dl",d.slice(0,50));
 b.downloads=(b.downloads||0)+1;
 try{await updateDoc(doc(db,"books",id),{downloads:increment(1)})}catch{}
}

document.addEventListener("click",async e=>{
 const t=e.target,g=a=>t.closest(`[${a}]`)?.getAttribute(a);let v;
 if(t.id=="mo"){$("#modal").innerHTML="";return}
 if(t.id=="mx"){$("#modal").innerHTML="";return}
 if(t.id=="sb"){doSearch();return}
 if(t.id=="br"){$("#list").scrollIntoView({behavior:"smooth"});return}
 if(t.id=="cx"){q="";$("#q").value="";t.hidden=true;$("#q").blur();renderList();setS();return}
 if((v=g("data-sg"))){const b=books.find(x=>x.id==v);if(b){q=b.title;$("#q").value=q;$("#cx").hidden=false;doSearch()}return}
 if((v=g("data-ba"))!=null){go(BN[v].attach);return}
 if((v=g("data-bl"))!=null){go(BN[v].link);return}
 if((v=g("data-dl"))){await download(v);return}
 if((v=g("data-fav"))){const f=LS("fav",[]);SV("fav",f.includes(v)?f.filter(x=>x!=v):[...f,v]);detail(v);return}
 if((v=g("data-id"))){detail(v);return}
 if(t.dataset.t){F={type:t.dataset.t,val:""};renderFilters();renderList();return}
 if(t.closest("[data-v]")){F.val=t.closest("[data-v]").dataset.v;renderFilters();renderList();return}
 if(t.closest("[data-c]")){const c=t.closest("[data-c]").dataset.c;F={type:"category",val:F.val==c&&F.type=="category"?"":c};home();return}
 if((v=g("data-go"))){const[k,n]=v.split("|");F={type:k,val:n};location.hash="";return}
});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;$("#cx").hidden=!q;renderList();setS()}});
document.addEventListener("keydown",e=>{if(e.target.id=="q"&&e.key=="Enter")doSearch();if(e.key=="Escape")$("#modal").innerHTML=""});
document.addEventListener("focusin",e=>{if(e.target.id=="q")setS()});
document.addEventListener("focusout",e=>{if(e.target.id=="q")setTimeout(setS,200)});

const NAV=[["","🏠","Home"],["#cats","▦","Categories"],["#fav","☆","Favorites"],["#dl","⬇","Downloads"],["#about","ⓘ","About"]];
function route(){
 const h=location.hash;clearInterval(tm);document.body.classList.remove("searching");
 $("#adslot").style.display=h?"none":"";
