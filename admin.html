<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SSC MATE Admin</title>
<style>
:root{--b:#0b3fbf;--b2:#0a58ff;--bg:#f4f7fd;--t:#10193a;--m:#5b6685;--bd:#e1e7f5}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:820px;margin:0 auto;padding:0 14px 40px}
header{background:var(--b);color:#fff;padding:14px 16px;margin-bottom:14px}
header .w{display:flex;justify-content:space-between;align-items:center;padding:0}
header b{color:#ffc400}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
input[type=checkbox]{width:auto}
.btn{background:var(--b2);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.red{background:#d92d2d}.gray{background:#6b7390}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:8px 16px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:10px 0}
.row:last-child{border:0}
.row img{width:90px;height:40px;object-fit:cover;border-radius:6px;background:#dbe4fb}
.row small{color:var(--m)}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#login{max-width:380px;margin:12vh auto 0;padding:0 14px}
.err{color:#d92d2d;font-size:14px;margin-top:10px}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10193a;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style></head>
<body>
<p id="chk" style="text-align:center;margin-top:30vh;color:#5b6685">Verifying...</p>

<!-- LOGIN: panel tabhi khulega jab email+password sahi ho -->
<div id="login" class="hide"><div class="panel">
 <h2>SSC <span style="color:#0b3fbf">MATE</span> Admin</h2>
 <label>Email</label><input id="em" type="email" autocomplete="username">
 <label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <br><br><button class="btn" id="lg" style="width:100%">Login</button>
 <p style="margin-top:12px;text-align:center"><a href="#" id="fp" style="font-size:13px;color:var(--b2)">Password bhool gaye?</a></p>
 <p class="err" id="er"></p>
</div></div>

<div id="panel" class="hide">
 <header><div class="w"><h3>SSC <b>MATE</b> Admin</h3><button class="btn sm gray" id="lo">Logout</button></div></header>
 <div class="w"><div class="tabs" id="tabs"></div><div id="body"></div></div>
</div>
<div id="toast"></div>

<script type="module">
import {db,auth,ADMIN_EMAIL} from "./firebase-config.js";
import {collection,getDocs,addDoc,updateDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};
const TYPES={category:"Category",subcategory:"Sub Category",subject:"Subject",exam:"Exam",teacher:"Teacher",coaching:"Coaching"};
const DEF={category:["Competitive Exam","Academic Books","Novels & Fiction","Self Help","Biography"],subcategory:[],
 subject:["Maths","English","Reasoning","General Knowledge","General Science","History","Geography","Polity","Economics","Computer","Current Affairs"],
 exam:["SSC CGL","SSC CHSL","SSC MTS","SSC GD","SSC CPO","SSC JE","Railway","Banking"],teacher:[],coaching:[]};
let books=[],tax=[],banners=[],tab="banners",edit=null;
const vals=t=>[...new Set([...DEF[t],...tax.filter(x=>x.type==t).map(x=>x.name)])];

async function load(){
 const g=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
 try{[books,tax,banners]=await Promise.all([g("books"),g("tax"),g("banners")])}catch(e){toast("Load error: "+e.message)}
 banners.sort((a,b)=>(a.order||0)-(b.order||0));
}

/* ===== AUTH GATE ===== */
const isAdmin=u=>u&&u.email&&u.email.toLowerCase()==ADMIN_EMAIL.toLowerCase();
onAuthStateChanged(auth,async u=>{
 $("#chk").classList.add("hide");
 if(isAdmin(u)){$("#login").classList.add("hide");await load();$("#panel").classList.remove("hide");render()}
 else{
  $("#panel").classList.add("hide");$("#login").classList.remove("hide");
  if(u){$("#er").textContent="Ye account admin nahi hai.";await signOut(auth)}
 }
});
$("#lg").onclick=async()=>{
 $("#er").textContent="";
 try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}
 catch{$("#er").textContent="Email ya password galat hai."}
};
$("#pw").onkeydown=e=>{if(e.key=="Enter")$("#lg").click()};
$("#fp").onclick=async e=>{e.preventDefault();const m=$("#em").value.trim();if(!m){$("#er").textContent="Pehle email likho.";return}
 try{await sendPasswordResetEmail(auth,m);$("#er").style.color="#0a7a3b";$("#er").textContent="Reset link email par bhej diya."}catch{$("#er").textContent="Reset nahi ho paya."}};
$("#lo").onclick=()=>signOut(auth);

/* ===== RENDER ===== */
function render(){
 $("#tabs").innerHTML=[["banners","🖼 Banners"],["books","📚 Books"],["tax","🏷 Categories & Tabs"]].map(([k,l])=>`<button data-tab="${k}" class="${tab==k?"on":""}">${l}</button>`).join("");
 $("#body").innerHTML=tab=="banners"?bannersView():tab=="books"?booksView():taxView();
}
function bannersView(){
 const e=edit?banners.find(b=>b.id==edit)||{}:{};
 return `<div class="panel"><h3>${edit?"Banner edit karo":"Naya banner add karo"}</h3><form id="nf">
 <label>Banner image link (live URL) *</label><input name="img" required value="${esc(e.img)}" placeholder="https://.../banner.jpg">
 <div class="two"><div><label>Title</label><input name="title" value="${esc(e.title)}"></div><div><label>Chhoti line</label><input name="sub" value="${esc(e.sub)}"></div></div>
 <label>Banner click link (banner dabate hi yahan jaayega)</label><input name="link" value="${esc(e.link)}" placeholder="https://...">
 <label>Attachment link (PDF / file / page)</label><input name="attach" value="${esc(e.attach)}" placeholder="https://...">
 <div class="two"><div><label>Attachment button text</label><input name="btn" value="${esc(e.btn||"Attachment")}"></div><div><label>Order (chhota number pehle)</label><input name="order" type="number" value="${e.order??banners.length+1}"></div></div>
 <label><input type="checkbox" name="active" ${e.active===false?"":"checked"}> Active (homepage par dikhao)</label><br>
 <button class="btn" type="submit">${edit?"Update":"Save"} banner</button> ${edit?`<button class="btn gray" type="button" data-cx>Cancel</button>`:""}</form></div>
 <div class="panel"><h3>Banners (${banners.length})</h3>${banners.map(b=>`<div class="row"><img src="${esc(b.img)}" alt=""><div class="grow"><b>${esc(b.title||"(no title)")}</b><br><small>#${b.order??0} • ${b.active===false?"Hidden":"Live"}</small></div><div><button class="btn sm" data-ed="${b.id}">Edit</button> <button class="btn sm red" data-rm="banners|${b.id}">Delete</button></div></div>`).join("")||"<small>Abhi koi banner nahi</small>"}</div>`;
}
function booksView(){
 const e=edit?books.find(b=>b.id==edit)||{}:{};
 const sel=t=>`<div><label>${TYPES[t]}</label><select name="${t}"><option value="">— none —</option>${vals(t).map(v=>`<option ${e[t]==v?"selected":""}>${esc(v)}</option>`).join("")}</select></div>`;
 return `<div class="panel"><h3>${edit?"Book edit karo":"Nayi book add karo"}</h3><form id="bf">
 <label>Title *</label><input name="title" required value="${esc(e.title)}">
 <label>Author / Publisher</label><input name="author" value="${esc(e.author)}">
 <label>Thumbnail live link *</label><input name="thumb" required value="${esc(e.thumb)}">
 <label>PDF download link *</label><input name="pdf" required value="${esc(e.pdf)}">
 <label>File size (e.g. 4.2 MB)</label><input name="size" value="${esc(e.size)}">
 <label>Details / Description</label><textarea name="desc" rows="4">${esc(e.desc)}</textarea>
 <label>Tags (comma se alag)</label><input name="tags" value="${esc(e.tags)}">
 <div class="two">${Object.keys(TYPES).map(sel).join("")}</div>
 <label><input type="checkbox" name="popular" ${e.popular?"checked":""}> Popular Books me dikhao</label><br>
 <button class="btn" type="submit">${edit?"Update":"Save"} book</button> ${edit?`<button class="btn gray" type="button" data-cx>Cancel</button>`:""}</form></div>
 <div class="panel"><h3>Saari books (${books.length})</h3>${books.map(b=>`<div class="row"><div class="grow"><b>${esc(b.title)}</b><br><small>${esc(b.category||"")} • ⬇ ${b.downloads||0}</small></div><div><button class="btn sm" data-ed="${b.id}">Edit</button> <button class="btn sm red" data-rm="books|${b.id}">Delete</button></div></div>`).join("")||"<small>Abhi koi book nahi</small>"}</div>`;
}
function taxView(){
 return `<div class="panel"><h3>Naya tab / category jodo</h3><label>Type</label><select id="tt">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <label>Naam</label><input id="tn" placeholder="e.g. Maths, Pinnacle, Gagan Pratap"><br><br><button class="btn" id="ta">Add</button></div>`+
 Object.entries(TYPES).map(([k,v])=>`<div class="panel"><b>${v}</b>${vals(k).map(n=>{const d=tax.find(x=>x.type==k&&x.name==n);return `<div class="row"><span>${esc(n)}</span>${d?`<button class="btn sm red" data-rm="tax|${d.id}">Delete</button>`:"<small>inbuilt</small>"}</div>`}).join("")||"<br><small>Khali</small>"}</div>`).join("");
}

/* ===== ACTIONS ===== */
async function refresh(){await load();render()}
document.addEventListener("click",async e=>{
 const t=e.target;let v;
 if((v=t.dataset.tab)){tab=v;edit=null;render();return}
 if((v=t.dataset.ed)){edit=v;render();scrollTo(0,0);return}
 if("cx" in t.dataset){edit=null;render();return}
 if((v=t.dataset.rm)&&confirm("Pakka delete karna hai?")){const[c,id]=v.split("|");await deleteDoc(doc(db,c,id));toast("Deleted");await refresh();return}
 if(t.id=="ta"){const n=$("#tn").value.trim();if(n){await addDoc(collection(db,"tax"),{type:$("#tt").value,name:n});toast("Added");await refresh()}}
});
document.addEventListener("submit",async e=>{
 e.preventDefault();
 const f=new FormData(e.target),d=Object.fromEntries(f),c=e.target.id=="nf"?"banners":"books";
 if(c=="banners"){d.active=!!f.get("active");d.order=parseInt(d.order)||0}else d.popular=!!f.get("popular");
 try{
  if(edit)await updateDoc(doc(db,c,edit),d);else await addDoc(collection(db,c),c=="books"?{...d,downloads:0,createdAt:Date.now()}:{...d,createdAt:Date.now()});
  edit=null;toast("Saved ✅");await refresh();
 }catch(x){toast("Error: "+x.message)}
});
</script>
</body></html>
